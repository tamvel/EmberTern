<!-- Lucide `keyboard` verbatim: rounded rect (2,4,20x16,rx2), two rows of key dots and the space bar.
     The dots sit at y8 and y12, i.e. 4 apart, which is NOT a multiple of 1.5 — the spacing rule in ICONS.md
     was written for long parallel RULES, where the eye compares thickness along a length and one reads
     visibly heavier. Two rows of round dots are not that case, so the upstream geometry is kept. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="4" width="20" height="16" rx="2" />
  <path d="M6 8h.01" />
  <path d="M10 8h.01" />
  <path d="M14 8h.01" />
  <path d="M18 8h.01" />
  <path d="M12 12h.01" />
  <path d="M16 12h.01" />
  <path d="M7 16h10" />
</svg>
