<!-- Hamburger, ENLARGED from Lucide's `menu` (which is x4→20 at y6/12/18) so its optical size matches the
     other titlebar icons. The SvgIcon ControlTheme scales a fixed 24×24 Canvas, not the path's ink, so a
     geometry that fills less of the box simply renders smaller: Lucide's menu has a 18×14 ink box against
     PanelLeft's 20×20, Trash's 20×22 and Copy's 22×22 — the shortest glyph on the bar. These rules span
     x3→21 at y4/12/20 → a 20×18 ink box, matching PanelLeft's width and 90% of its height. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <line x1="3" x2="21" y1="4" y2="4" />
  <line x1="3" x2="21" y1="12" y2="12" />
  <line x1="3" x2="21" y1="20" y2="20" />
</svg>
